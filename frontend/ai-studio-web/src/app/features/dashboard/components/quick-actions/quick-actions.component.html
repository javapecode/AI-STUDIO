<div class="panel">

    <h3>Quick Actions</h3>

    <div class="actions">

        <button class="action-btn"(click)="openNewProject()">
            <span class="icon">➕</span>
            <span>
                <strong>New Project</strong>
                <small>Create a new AI project</small>
            </span>
        </button>


        <button class="action-btn" (click)="uploadImages()">
            <span class="icon">📤</span>
            <span>
                <strong>Upload Images</strong>
                <small>Add images for creation</small>
            </span>
        </button>


        <button class="action-btn"(click)="openAI()">
            <span class="icon">🤖</span>
            <span>
                <strong>AI Generate</strong>
                <small>Create AI content</small>
            </span>
        </button>


        <button class="action-btn"(click)="openEditor()">
            <span class="icon">🎬</span>
            <span>
                <strong>Video Editor</strong>
                <small>Edit your videos</small>
            </span>
        </button>


    </div>

</div>
