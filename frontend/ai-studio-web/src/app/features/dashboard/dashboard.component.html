<app-welcome-banner></app-welcome-banner>

<!-- Stats -->
<div class="stats">

    <app-dashboard-card
        *ngFor="let stat of stats"
        [title]="stat.title"
        [value]="stat.value"
        [icon]="stat.icon">
    </app-dashboard-card>

</div>

<!-- Bottom Section -->
<div class="dashboard-grid">

    <app-recent-projects></app-recent-projects>

    <app-quick-actions></app-quick-actions>

</div>
